<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;

body{

#app{

#subText{

}

#vignette{

#flash{

#redFlash{

#glitch{

/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioCtx = null;
let master = null;
let ambientGain = null;
let ambientOsc = null;
let heartbeatTimer = null;

function audioStart(){

    if(audioCtx) return;

    const AC = window.AudioContext || window.webkitAudioContext;

    if(!AC) return;

    audioCtx = new AC();

    master = audioCtx.createGain();
    master.gain.value = .18;
    master.connect(audioCtx.destination);

    ambientGain = audioCtx.createGain();
    ambientGain.gain.value = .025;
    ambientGain.connect(master);

    ambientOsc = audioCtx.createOscillator();
    ambientOsc.type = "sine";
    ambientOsc.frequency.value = 38;

    ambientOsc.connect(ambientGain);
    ambientOsc.start();

    heartbeatTimer = setInterval(()=>{
        if(audioCtx) heartbeat(.035);
    }, 3200);
}

function tone(freq=440,duration=.08,type="sine",volume=.08){

    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0,audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(volume,audioCtx.currentTime+.01);
    gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);

    osc.connect(gain);
    gain.connect(master);

    osc.start();
    osc.stop(audioCtx.currentTime+duration+.02);
}

function noiseBurst(duration=.12,volume=.12){

    if(!audioCtx) return;

    const buffer = audioCtx.createBuffer(
        1,
        audioCtx.sampleRate*duration,
        audioCtx.sampleRate
    );

    const data = buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
        data[i]=(Math.random()*2-1);
    }

    const source = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();

    gain.gain.value=volume;

    source.buffer=buffer;
    source.connect(gain);
    gain.connect(master);

    source.start();

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );
}

function heartbeat(volume=.08){

    if(!audioCtx) return;

    tone(55,.07,"sine",volume);
    setTimeout(()=>{
        tone(45,.10,"sine",volume*.8);
    },100);
}

function clickSound(){

    tone(900,.025,"square",.025);
}

function typingSound(){

    tone(
        120 + Math.random()*100,
        .018,
        "square",
        .012
    );
}

function errorSound(){

    tone(90,.15,"sawtooth",.07);

    setTimeout(()=>{
        tone(55,.22,"sawtooth",.05);
    },80);
}

function tensionSound(){

    if(!audioCtx) return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="sawtooth";
    osc.frequency.setValueAtTime(48,audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(
        120,
        audioCtx.currentTime+3
    );

    gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .09,
        audioCtx.currentTime+2
    );
    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+3.2
    );

    osc.connect(gain);
    gain.connect(master);

    osc.start();
    osc.stop(audioCtx.currentTime+3.3);
}

function impact(){

    noiseBurst(.22,.25);
    tone(48,.5,"sine",.18);

    setTimeout(()=>{
        heartbeat(.14);
    },130);
}

function silenceAudio(){

    if(!master) return;

    master.gain.cancelScheduledValues(audioCtx.currentTime);

    master.gain.setValueAtTime(
        master.gain.value,
        audioCtx.currentTime
    );

    master.gain.linearRampToValueAtTime(
        .0001,
        audioCtx.currentTime+.5
    );
}

function restoreAudio(){

    if(!master) return;

    master.gain.cancelScheduledValues(audioCtx.currentTime);

    master.gain.linearRampToValueAtTime(
        .18,
        audioCtx.currentTime+.8
    );
}

/* =========================================================
   VISUAL EFFECTS
========================================================= */

function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

async function flashScreen(type="white"){

    const el = type==="red" ? redFlash : flash;

    el.style.transition="none";
    el.style.opacity=".9";

    await sleep(40);

    el.style.transition="opacity .35s";
    el.style.opacity="0";
}

async function glitchBurst(duration=500){

    document.body.classList.add("glitching");

    glitch.style.opacity=".35";

    noiseBurst(.1,.15);

    await sleep(duration);

    glitch.style.opacity="0";
    document.body.classList.remove("glitching");
}

async function shake(duration=600){

    document.body.classList.add("shake");

    await sleep(duration);

    document.body.classList.remove("shake");
}

async function redMode(duration=1000){

    document.body.classList.add("red");

    await sleep(duration);

    document.body.classList.remove("red");
}

async function blackOut(duration=1200){

    document.body.classList.add("dark");

    await sleep(duration);

    document.body.classList.remove("dark");
}

========================================================= */

    inputArea.style.display="none";

    mainText.innerHTML="";

    answer.value="";

function showText(ey,text,sub="",duration=0){

    clearUI();

    eyebrow.textContent=ey||"";
    mainText.innerHTML=text;
    subText.innerHTML=sub;

    if(duration){
        return sleep(duration);
    }

    return Promise.resolve();

function showInput(question,placeholder=""){

    clearUI();

    currentQuestion=question;

    eyebrow.textContent=question.ey||"";

    mainText.textContent=question.text;

    subText.textContent=question.sub||"";

    answer.placeholder=placeholder;

    inputArea.style.display="flex";

    answer.focus();

    updateProgress();

    typingStarted=Date.now();
}

function updateProgress(){

    const total=QUESTIONS.length;

    const percent=Math.max(
        0,
        Math.min(
            100,
            ((sceneIndex+1)/total)*100
        )
    );

    progressBar.style.width=percent+"%";
}

/* =========================================================
   ANSWER ANALYSIS
========================================================= */

let typingStarted=0;

function normalize(text){
    return text
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s]/gu," ")
        .replace(/\s+/g," ")
        .trim();
}

function analyzeAnswer(text){

    const clean=normalize(text);
    const words=clean.split(" ").filter(Boolean);

    const result={
        clean,
        words,
        length:text.length,
        wordCount:words.length,
        valid:false,
        reason:""
    };

    if(!clean){
        result.reason="Musisz coś napisać.";
        return result;
    }

    if(words.length<2 && text.length<8){
        result.reason="To za mało. Napisz normalną odpowiedź.";
        return result;
    }

    const repeated = /(.)\1{5,}/.test(clean);

    const gibberish =
        /^[a-z0-9]{1,18}$/i.test(clean) &&
        !/[aeiouyąęó]/i.test(clean);

    const keyboardMash =
        /(asdf|qwer|zxcv|jkl|2131|1234|aaaa|ffff|jaja)/i.test(clean);

    const suspicious =
        repeated ||
        gibberish ||
        keyboardMash;

    if(suspicious){

        result.reason=
            "Nie próbuj przejść przez to przypadkowym tekstem.";

        return result;
    }

    if(words.length<3 && text.length<12){

        result.reason=
            "Nie potrzebuję długiej odpowiedzi. Ale potrzebuję prawdziwej.";

        return result;
    }

    result.valid=true;

    return result;
}

function extractMemory(text){

    const clean=normalize(text);
    const words=clean.split(" ").filter(w=>w.length>3);

    memory.answers.push(text);

    words.forEach(word=>{
        if(!memory.words.includes(word)){
            memory.words.push(word);
        }
    });

    const emotionWords=[
        "strach","boję","boje","lęk","smutek",
        "złość","wkurza","sam","samotność",
        "miłość","rodzina","pieniądze",
        "praca","śmierć","utrata",
        "przyszłość","przeszłość",
        "wstyd","presja","stres"
    ];

    emotionWords.forEach(word=>{
        if(clean.includes(word) && !memory.emotions.includes(word)){
            memory.emotions.push(word);
        }
    });

    const peopleWords=[
        "mama","matka","ojciec","tata",
        "brat","siostra","dziewczyna",
        "chłopak","żona","mąż","przyjaciel",
        "przyjaciółka","rodzina"
    ];

    peopleWords.forEach(word=>{
        if(clean.includes(word) && !memory.people.includes(word)){
            memory.people.push(word);
        }
    });

    const fearWords=[
        "boję","boje","strach","lęk",
        "utracić","stracić","samotny",
        "śmierć","umrzeć","zdrada",
        "porażka","przegrana","odrzucenie"
    ];

    fearWords.forEach(word=>{
        if(clean.includes(word) && !memory.fears.includes(word)){
            memory.fears.push(word);
        }
    });

    if(text.length<15) memory.shortAnswers++;
    if(text.length>120) memory.longAnswers++;
}

/* =========================================================
   SCENE SYSTEM
========================================================= */

async function start(){

    if(started) return;

    started=true;

    audioStart();

    if(audioCtx && audioCtx.state==="suspended"){
        await audioCtx.resume();
    }

    clickSound();

    await sleep(500);

    await showText(
        "MIRROR",
        "ZACZYNAMY.",
        "To zajmie kilka minut.",
        1800
    );

    await showText(
        "",
        "Nie próbuj odpowiadać dobrze.",
        "",
        1500
    );

    await showText(
        "",
        "Po prostu odpowiadaj.",
        "",
        1200
    );

    sceneIndex=0;

    await questionScene(0);
}

async function questionScene(index){

    locked=false;

    currentQuestion=QUESTIONS[index];

    updateProgress();

    showInput(
        currentQuestion,
        currentQuestion.placeholder
    );

    if(index===0){

        restoreAudio();

        tone(330,.15,"sine",.035);

    }

    if(index===1){

        await sleep(300);

        tone(260,.12,"sine",.03);

    }

    if(index===2){

        await sleep(500);

        heartbeat(.045);

    }

    if(index===3){

        await sleep(700);

        tone(180,.3,"sine",.04);

    }

    if(index===4){

        /*
           THE FIRST MAJOR HORROR MOMENT
        */

        await sleep(900);

        silenceAudio();

        await sleep(1200);

        restoreAudio();

        heartbeat(.09);

        await sleep(700);

        tone(70,.3,"sine",.08);
    }

    if(index===5){

        tensionSound();

    }

    if(index===6){

        await sleep(600);

        tone(410,.1,"sine",.025);

    }

    if(index===7){

        await sleep(800);

        heartbeat(.075);

    }

    if(index===8){

        await sleep(900);

        tone(130,.2,"sawtooth",.04);

    }

    if(index===9){

        tensionSound();

    }

    if(index===10){

        silenceAudio();

        await sleep(1600);

        restoreAudio();

        heartbeat(.07);

    }

    if(index===11){

        await sleep(800);

        heartbeat(.1);

    }

    if(index===12){

        tensionSound();

    }
}

async function submitAnswer(){

    if(locked) return;

    locked=true;

    const text=answer.value.trim();

    clickSound();

    const result=analyzeAnswer(text);

    if(!result.valid){

        locked=false;

        errorSound();

        answer.style.borderColor="#ff3333";

        subText.textContent=result.reason;

        await shake(220);

        await sleep(700);

        answer.style.borderColor="rgba(255,255,255,.2)";

        answer.focus();

        return;
    }

    extractMemory(text);

    const elapsed=Date.now()-typingStarted;

    memory.typingTimes.push(elapsed);

    answer.disabled=true;

    inputArea.style.opacity=".35";

    await processAnswer(sceneIndex,result);

    inputArea.style.opacity="1";

    answer.disabled=false;

    if(sceneIndex>=QUESTIONS.length-1){

        await finalSequence();

        return;
    }

    sceneIndex++;

    await questionScene(sceneIndex);
}

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(str){

    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function capitalize(str){

    return str.charAt(0).toUpperCase()+str.slice(1);
}

/* =========================================================
   INPUT EVENTS
========================================================= */

answer.addEventListener("input",()=>{

    if(locked) return;

    typingSound();

    if(answer.value.length>0){

        cursor.style.display="block";

    }

    if(answer.value.length>10){

        answer.style.borderColor=
            "rgba(255,255,255,.32)";
    }
});

answer.addEventListener("keydown",e=>{

    if(e.key==="Enter" && !e.shiftKey){

        e.preventDefault();

        submitAnswer();

    }

    if(e.key==="Backspace"){

        memory.deletes++;

        tone(180,.015,"square",.008);
    }
});
