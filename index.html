<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRROR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    cursor:default;
    transition:background .5s,color .5s;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,#111 0%,#070707 45%,#020202 100%);
}

#noise{
    position:absolute;
    inset:-50%;
    opacity:.035;
    pointer-events:none;
    z-index:90;
    background-image:
        repeating-radial-gradient(circle at 0 0,#fff 0 1px,transparent 1px 3px);
    animation:noiseMove .15s steps(2) infinite;
}

#scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:80;
    opacity:.08;
    background:repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(255,255,255,.12) 4px
    );
}

#vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:81;
    background:radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0,0,0,.35) 65%,
        rgba(0,0,0,.92) 100%
    );
}

#flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:200;
}

#redFlash{
    position:absolute;
    inset:0;
    background:#d00;
    opacity:0;
    mix-blend-mode:screen;
    pointer-events:none;
    z-index:199;
}

#content{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(850px,88vw);
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:20;
}

#eyebrow{
    min-height:20px;
    margin-bottom:22px;
    font-size:11px;
    letter-spacing:5px;
    color:#666;
    transition:.3s;
}

#mainText{
    max-width:850px;
    font-size:clamp(27px,4vw,55px);
    font-weight:600;
    line-height:1.08;
    letter-spacing:-1px;
    min-height:65px;
    transition:opacity .25s,transform .25s,filter .25s;
    text-shadow:0 0 30px rgba(255,255,255,.04);
}

#subText{
    margin-top:20px;
    max-width:700px;
    min-height:25px;
    font-size:14px;
    color:#666;
    line-height:1.5;
    transition:.3s;
}

#inputArea{
    width:min(650px,88vw);
    margin-top:45px;
    opacity:0;
    transform:translateY(12px);
    pointer-events:none;
    transition:.35s;
}

#answer{
    width:100%;
    background:transparent;
    border:0;
    border-bottom:1px solid #444;
    color:white;
    outline:none;
    padding:12px 4px;
    text-align:center;
    font-size:25px;
    letter-spacing:1px;
    transition:.25s;
}

#answer:focus{
    border-bottom-color:#aaa;
}

#answer::placeholder{
    color:#333;
}

#send{
    margin-top:25px;
    background:#eee;
    color:#050505;
    border:0;
    padding:12px 28px;
    font-weight:bold;
    letter-spacing:2px;
    cursor:pointer;
    transition:.2s;
}

#send:hover{
    transform:scale(1.05);
}

#send:active{
    transform:scale(.95);
}

#start{
    margin-top:38px;
    padding:14px 35px;
    border:1px solid #555;
    color:#eee;
    background:#080808;
    letter-spacing:4px;
    cursor:pointer;
    transition:.25s;
}

#start:hover{
    background:#eee;
    color:#050505;
    border-color:#eee;
}

#progress{
    position:absolute;
    left:25px;
    bottom:22px;
    width:180px;
    height:2px;
    background:#1a1a1a;
    z-index:25;
}

#progressBar{
    height:100%;
    width:0%;
    background:#aaa;
    transition:width 1s ease;
}

#counter{
    position:absolute;
    right:25px;
    bottom:17px;
    font-size:10px;
    letter-spacing:3px;
    color:#444;
    z-index:25;
}

#cursor{
    position:fixed;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ddd;
    opacity:0;
    pointer-events:none;
    z-index:300;
    transform:translate(-50%,-50%);
    transition:background .2s,width .2s,height .2s;
}

#particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:10;
}

.particle{
    position:absolute;
    color:#777;
    font-size:10px;
    opacity:0;
    pointer-events:none;
    user-select:none;
}

#floatingText{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:110;
}

.floatWord{
    position:absolute;
    color:#aaa;
    font-size:12px;
    letter-spacing:4px;
    opacity:0;
    white-space:nowrap;
}

#warning{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(30px,7vw,90px);
    font-weight:900;
    letter-spacing:8px;
    color:#fff;
    opacity:0;
    pointer-events:none;
    z-index:250;
    text-shadow:
        3px 0 #900,
        -3px 0 #0aa;
}

#redCorner{
    position:absolute;
    width:5px;
    height:5px;
    background:#f00;
    box-shadow:0 0 15px #f00;
    opacity:0;
    z-index:150;
}

body.redMode #app{
    background:
        radial-gradient(circle at 50% 45%,#220000 0%,#090000 50%,#020000 100%);
}

body.redMode #mainText{
    color:#eee;
}

body.invert{
    filter:invert(1);
}

body.dark #mainText{
    color:#333;
}

.shake{
    animation:shake .09s infinite;
}

.bigShake{
    animation:bigShake .06s infinite;
}

.glitch{
    animation:glitch .12s steps(2) infinite;
}

.flicker{
    animation:flicker .18s steps(2) infinite;
}

.floatUp{
    animation:floatUp 1.5s ease-out forwards;
}

.fadeAway{
    animation:fadeAway 1s ease forwards;
}

@keyframes noiseMove{
    0%{transform:translate(0,0)}
    25%{transform:translate(3%,2%)}
    50%{transform:translate(-2%,4%)}
    75%{transform:translate(4%,-3%)}
    100%{transform:translate(0,0)}
}

@keyframes shake{
    0%{transform:translate(-50%,-50%)}
    25%{transform:translate(calc(-50% + 3px),calc(-50% - 2px))}
    50%{transform:translate(calc(-50% - 3px),calc(-50% + 2px))}
    75%{transform:translate(calc(-50% + 2px),calc(-50% + 3px))}
    100%{transform:translate(-50%,-50%)}
}

@keyframes bigShake{
    0%{transform:translate(-50%,-50%)}
    25%{transform:translate(calc(-50% + 13px),calc(-50% - 8px))}
    50%{transform:translate(calc(-50% - 12px),calc(-50% + 9px))}
    75%{transform:translate(calc(-50% + 8px),calc(-50% + 12px))}
    100%{transform:translate(-50%,-50%)}
}

@keyframes glitch{
    0%{transform:translate(-50%,-50%) skew(0)}
    20%{transform:translate(calc(-50% + 8px),-50%) skew(4deg)}
    40%{transform:translate(calc(-50% - 6px),-50%) skew(-5deg)}
    60%{transform:translate(-50%,calc(-50% + 4px)) skew(2deg)}
    80%{transform:translate(calc(-50% + 3px),-50%) skew(-2deg)}
    100%{transform:translate(-50%,-50%)}
}

@keyframes flicker{
    0%,100%{opacity:1}
    20%{opacity:.15}
    30%{opacity:.8}
    50%{opacity:.05}
    70%{opacity:1}
}

@keyframes floatUp{
    0%{
        opacity:0;
        transform:translateY(30px) scale(.8);
    }
    15%{opacity:1}
    80%{opacity:.6}
    100%{
        opacity:0;
        transform:translateY(-120px) scale(1.4);
    }
}

@keyframes fadeAway{
    from{opacity:1;filter:blur(0)}
    to{opacity:0;filter:blur(12px)}
}
</style>
</head>

<body>

<div id="app">

    <div id="noise"></div>
    <div id="scanlines"></div>
    <div id="vignette"></div>

    <div id="flash"></div>
    <div id="redFlash"></div>

    <div id="particles"></div>
    <div id="floatingText"></div>

    <div id="warning"></div>

    <div id="content">
        <div id="eyebrow">MIRROR</div>
        <div id="mainText">Nie będę Cię o nic prosić.</div>
        <div id="subText">To zajmie kilka minut.</div>

        <button id="start">ROZPOCZNIJ</button>

        <div id="inputArea">
            <input
                id="answer"
                autocomplete="off"
                spellcheck="false"
                maxlength="120"
                placeholder="jedno słowo wystarczy"
            >
            <button id="send">DALEJ</button>
        </div>
    </div>

    <div id="progress">
        <div id="progressBar"></div>
    </div>

    <div id="counter">00 / 00</div>

    <div id="redCorner"></div>
    <div id="cursor"></div>

</div>

<script>
/* =========================================================
   MIRROR — PSYCHOLOGICAL HORROR EXPERIENCE
   Wszystko działa lokalnie.
   Brak API.
   Brak kamery.
   Brak mikrofonu.
   Brak wysyłania odpowiedzi.
========================================================= */

const $ = id => document.getElementById(id);

const app = $("app");
const content = $("content");
const eyebrow = $("eyebrow");
const mainText = $("mainText");
const subText = $("subText");
const inputArea = $("inputArea");
const answer = $("answer");
const send = $("send");
const start = $("start");
const progressBar = $("progressBar");
const counter = $("counter");
const flash = $("flash");
const redFlash = $("redFlash");
const particles = $("particles");
const floatingText = $("floatingText");
const warning = $("warning");
const cursor = $("cursor");
const redCorner = $("redCorner");

let running = false;
let locked = false;
let index = -1;
let audioStarted = false;
let ambient = null;
let ambientGain = null;

const memory = {
    answers: [],
    words: [],
    people: [],
    fears: [],
    objects: [],
    emotions: [],
    first: "",
    alone: "",
    lastAnswer: "",
    hesitation: 0,
    changedAnswer: false
};


/* =========================================================
   AUDIO ENGINE
========================================================= */

const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

let audioCtx;
let master;

function initAudio(){

    if(audioStarted) return;

    audioStarted = true;

    try{

        audioCtx = new AudioContextClass();

        master = audioCtx.createGain();
        master.gain.value = 0.28;

        master.connect(audioCtx.destination);

        startAmbient();

    }catch(e){
        console.log("Audio unavailable");
    }
}

function now(){
    return audioCtx ? audioCtx.currentTime : 0;
}

function tone(freq, duration, volume=.08, type="sine", delay=0){

    if(!audioCtx) return;

    const t = now()+delay;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq,t);

    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(
        Math.max(.0002,volume),
        t+.015
    );
    gain.gain.exponentialRampToValueAtTime(
        .0001,
        t+duration
    );

    osc.connect(gain);
    gain.connect(master);

    osc.start(t);
    osc.stop(t+duration+.05);
}

function sweep(from,to,duration=.8,volume=.08,type="sine"){

    if(!audioCtx) return;

    const t=now();

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;

    osc.frequency.setValueAtTime(from,t);
    osc.frequency.exponentialRampToValueAtTime(
        Math.max(20,to),
        t+duration
    );

    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(volume,t+.03);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);

    osc.connect(gain);
    gain.connect(master);

    osc.start(t);
    osc.stop(t+duration+.05);
}

function noise(duration=.25,volume=.08,filterFreq=1800,delay=0){

    if(!audioCtx) return;

    const buffer=audioCtx.createBuffer(
        1,
        audioCtx.sampleRate*duration,
        audioCtx.sampleRate
    );

    const data=buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
        data[i]=Math.random()*2-1;
    }

    const source=audioCtx.createBufferSource();
    const filter=audioCtx.createBiquadFilter();
    const gain=audioCtx.createGain();

    source.buffer=buffer;

    filter.type="bandpass";
    filter.frequency.value=filterFreq;
    filter.Q.value=1.4;

    const t=now()+delay;

    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(volume,t+.015);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(master);

    source.start(t);
}

function bass(freq=45,duration=.8,volume=.22){

    if(!audioCtx) return;

    const t=now();

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="sine";

    osc.frequency.setValueAtTime(freq,t);
    osc.frequency.exponentialRampToValueAtTime(
        Math.max(25,freq*.55),
        t+duration
    );

    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(volume,t+.03);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);

    osc.connect(gain);
    gain.connect(master);

    osc.start(t);
    osc.stop(t+duration+.1);
}

function clickSound(){

    tone(1700,.025,.07,"square");
    tone(850,.04,.035,"square",.025);
}

function softClick(){

    tone(700,.04,.025,"triangle");
}

function heartbeat(){

    tone(55,.16,.18,"sine");
    tone(48,.13,.13,"sine",.18);
}

function heartbeatFast(){

    heartbeat();
    heartbeat();
    setTimeout(heartbeat,380);
    setTimeout(heartbeat,570);
}

function impact(){

    bass(42,.55,.38);
    noise(.22,.18,420);
    tone(75,.5,.1,"sawtooth");
}

function metal(){

    tone(900,.35,.10,"metal");
    tone(1400,.2,.07,"square",.03);
    tone(430,.45,.05,"triangle",.1);
}

function highNeedle(){

    tone(3200,.18,.05,"sine");
    tone(3900,.12,.035,"sine",.16);
}

function horrorWhisper(){

    noise(.65,.045,700);
    tone(130,.7,.035,"triangle");
    tone(94,.9,.03,"sine",.2);
}

function digitalError(){

    for(let i=0;i<8;i++){
        tone(
            100+Math.random()*1800,
            .025+Math.random()*.05,
            .025,
            Math.random()>.5?"square":"sawtooth",
            i*.045
        );
    }
}

function explosion(){

    bass(30,.9,.5);
    noise(.55,.3,160);
    noise(.25,.18,900,.08);
    tone(70,.7,.18,"sawtooth");
}

function startAmbient(){

    if(!audioCtx) return;

    ambient=audioCtx.createOscillator();
    ambientGain=audioCtx.createGain();

    ambient.type="sine";
    ambient.frequency.value=43;
    ambientGain.gain.value=.018;

    ambient.connect(ambientGain);
    ambientGain.connect(master);

    ambient.start();
}

function ambientUp(value=.04){

    if(!ambientGain) return;

    ambientGain.gain.cancelScheduledValues(now());

    ambientGain.gain.linearRampToValueAtTime(
        value,
        now()+.8
    );
}

function ambientDown(){

    if(!ambientGain) return;

    ambientGain.gain.cancelScheduledValues(now());

    ambientGain.gain.linearRampToValueAtTime(
        .002,
        now()+.6
    );
}

function silenceAudio(){

    if(!master) return;

    master.gain.cancelScheduledValues(now());

    master.gain.linearRampToValueAtTime(
        .0001,
        now()+.15
    );
}

function restoreAudio(){

    if(!master) return;

    master.gain.cancelScheduledValues(now());

    master.gain.linearRampToValueAtTime(
        .28,
        now()+.8
    );
}


/* =========================================================
   VISUAL ENGINE
========================================================= */

function wait(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

function flashScreen(color="#fff",duration=80){

    const el=color==="#d00"?redFlash:flash;

    el.style.transition="none";
    el.style.opacity="1";

    setTimeout(()=>{
        el.style.transition=`opacity ${duration/1000}s ease`;
        el.style.opacity="0";
    },20);
}

function shake(ms=400,big=false){

    content.classList.remove("shake","bigShake");

    void content.offsetWidth;

    content.classList.add(big?"bigShake":"shake");

    setTimeout(()=>{
        content.classList.remove("shake","bigShake");
    },ms);
}

function glitch(ms=600){

    content.classList.add("glitch");

    setTimeout(()=>{
        content.classList.remove("glitch");
    },ms);
}

function flicker(ms=700){

    mainText.classList.add("flicker");

    setTimeout(()=>{
        mainText.classList.remove("flicker");
    },ms);
}

function redMode(on=true){

    document.body.classList.toggle("redMode",on);
}

function invert(ms=100){

    document.body.classList.add("invert");

    setTimeout(()=>{
        document.body.classList.remove("invert");
    },ms);
}

function blackout(ms=600){

    app.style.transition="background .1s";
    app.style.background="#000";

    mainText.style.opacity="0";
    subText.style.opacity="0";

    setTimeout(()=>{

        app.style.background="";
        mainText.style.opacity="1";
        subText.style.opacity="1";

    },ms);
}

function moveCursor(x,y,size=8,color="#ddd"){

    cursor.style.left=x+"px";
    cursor.style.top=y+"px";
    cursor.style.width=size+"px";
    cursor.style.height=size+"px";
    cursor.style.background=color;
    cursor.style.opacity="1";
}

function hideCursor(){
    cursor.style.opacity="0";
}

function randomParticle(symbol="·"){

    const p=document.createElement("div");

    p.className="particle";
    p.textContent=symbol;

    p.style.left=Math.random()*100+"%";
    p.style.top=(20+Math.random()*70)+"%";

    p.style.fontSize=(7+Math.random()*18)+"px";

    particles.appendChild(p);

    requestAnimationFrame(()=>{
        p.style.transition=
            "opacity .3s, transform 2s cubic-bezier(.2,.8,.2,1)";
        p.style.opacity=(.2+Math.random()*.6).toString();
        p.style.transform=
            `translate(${(-100+Math.random()*200)}px,${(-150+Math.random()*300)}px)
             rotate(${Math.random()*360}deg)`;
    });

    setTimeout(()=>{
        p.style.opacity="0";
    },900+Math.random()*1200);

    setTimeout(()=>{
        p.remove();
    },2500);
}

function particleBurst(count=20){

    for(let i=0;i<count;i++){

        setTimeout(()=>{
            randomParticle(
                Math.random()>.7
                    ? ["0","1","/","\\","—","?"][Math.floor(Math.random()*6)]
                    : "·"
            );
        },i*18);
    }
}

function floatingWord(text){

    const el=document.createElement("div");

    el.className="floatWord";
    el.textContent=text;

    el.style.left=(15+Math.random()*70)+"%";
    el.style.top=(25+Math.random()*55)+"%";

    floatingText.appendChild(el);

    requestAnimationFrame(()=>{
        el.classList.add("floatUp");
    });

    setTimeout(()=>el.remove(),1600);
}

function giantWarning(text,color="#fff",duration=900){

    warning.textContent=text;
    warning.style.color=color;
    warning.style.opacity="1";

    glitch(500);

    setTimeout(()=>{
        warning.style.transition="opacity .25s";
        warning.style.opacity="0";
    },duration);
}

function redCornerPulse(){

    redCorner.style.left=Math.random()*95+"%";
    redCorner.style.top=Math.random()*95+"%";
    redCorner.style.opacity="1";

    setTimeout(()=>{
        redCorner.style.opacity="0";
    },500);
}


/* =========================================================
   TEXT / UI
========================================================= */

function clearUI(){

    mainText.textContent="";
    subText.textContent="";
    eyebrow.textContent="";

    inputArea.style.opacity="0";
    inputArea.style.transform="translateY(12px)";
    inputArea.style.pointerEvents="none";

    answer.value="";
}

function showText(main,sub="",label="MIRROR"){

    clearUI();

    eyebrow.textContent=label;
    mainText.textContent=main;
    subText.textContent=sub;

    mainText.style.opacity="1";
    subText.style.opacity="1";
}

function showInput(){

    inputArea.style.opacity="1";
    inputArea.style.transform="translateY(0)";
    inputArea.style.pointerEvents="auto";

    answer.focus();
}

function updateProgress(){

    const total=questions.length;

    const percent=Math.max(
        0,
        Math.min(100,((index+1)/total)*100)
    );

    progressBar.style.width=percent+"%";

    counter.textContent=
        String(Math.max(0,index+1)).padStart(2,"0")
        +" / "+
        String(total).padStart(2,"0");
}


/* =========================================================
   PYTANIA
========================================================= */

const questions=[

    {
        text:"Jak się dziś czujesz?",
        label:"01",
        sound:"soft",
        hint:"jedno słowo wystarczy"
    },

    {
        text:"Co robiłeś rano?",
        label:"02",
        sound:"normal",
        hint:"jedno słowo"
    },

    {
        text:"Z kim najczęściej rozmawiasz?",
        label:"03",
        sound:"people",
        hint:"imię albo relacja"
    },

    {
        text:"Czego teraz chcesz?",
        label:"04",
        sound:"desire",
        hint:"jedno słowo"
    },

    {
        text:"Czego nie chcesz?",
        label:"05",
        sound:"dark",
        hint:"jedno słowo"
    },

    {
        text:"Czego się boisz?",
        label:"06",
        sound:"fear",
        hint:"nie musisz się tłumaczyć"
    },

    {
        text:"Komu ufasz?",
        label:"07",
        sound:"trust",
        hint:"jedno słowo"

/* =========================================================
   ANALIZA ODPOWIEDZI
========================================================= */

function cleanWord(value){

    return value
        .trim()
        .replace(/\s+/g," ")
        .slice(0,120);
}

function wordsOf(value){

    return cleanWord(value)
        .toLowerCase()
        .split(/\s+/)
        .filter(Boolean);
}

function rememberAnswer(value){

    const v=cleanWord(value);

    memory.answers.push(v);
    memory.lastAnswer=v;

    const words=wordsOf(v);

    words.forEach(word=>{

        if(word.length>=4 && !memory.words.includes(word)){
            memory.words.push(word);
        }

    });

    const people=[
        "mama","tata","brat","siostra",
        "dziewczyna","chłopak","partner",
        "żona","mąż","przyjaciel","przyjaciółka",
        "szef","kolega","koleżanka"
    ];

    const fears=[
        "śmierć","samotność","ciemność",
        "utrata","choroba","pieniądze",
        "praca","ludzie","porażka",
        "przyszłość","ból","wojna"
    ];

    const emotions=[
        "szczęśliwy","szczęśliwa","smutny","smutna",
        "zmęczony","zmęczona","spokojny","spokojna",
        "zły","zła","wkurzony","wkurzona",
        "samotny","samotna","przestraszony","przestraszona",
        "dobrze","źle","średnio"
    ];

    words.forEach(w=>{

        if(people.includes(w) && !memory.people.includes(w)){
            memory.people.push(w);
        }

        if(fears.includes(w) && !memory.fears.includes(w)){
            memory.fears.push(w);
        }

        if(emotions.includes(w) && !memory.emotions.includes(w)){
            memory.emotions.push(w);
        }

    });

    if(!memory.first){
        memory.first=v;
    }
}

function validAnswer(value){

    const v=cleanWord(value);

    if(!v) return false;

    if(v.length<2) return false;

    /* Pozwalamy na krótkie odpowiedzi tak/nie */
    const lower=v.toLowerCase();

    if(
        lower==="tak" ||
        lower==="nie" ||
        lower==="nie wiem" ||
        lower==="czasami" ||
        lower==="czasem"
    ){
        return true;
    }

    /* blokada przypadkowego spamowania */
    if(/(.)\1{5,}/i.test(v)) return false;

    if(/^[0-9]+$/.test(v)) return false;

    const letters=v.replace(/[^a-ząćęłńóśźż]/gi,"");

    if(letters.length<2) return false;

    return true;
}

async function submitAnswer(){

    if(!running || locked) return;

    const value=cleanWord(answer.value);

    if(!validAnswer(value)){

        answer.style.borderBottomColor="#900";

        tone(90,.18,.05,"square");

        await wait(250);

        answer.style.borderBottomColor="#444";

        answer.focus();

        return;
    }

    locked=true;

    answer.blur();

    rememberAnswer(value);

    /* zapisujemy specjalnie odpowiedź o samotności */

    if(index===7){
        memory.alone=value;
    }

    /* efekt przyjęcia */

    clickSound();

    inputArea.style.opacity="0";
    inputArea.style.pointerEvents="none";

    await wait(250);

    /* reakcja właściwa */

    await answerReaction(
        questions[index],
        value
    );

    /* zaplanowane przerywniki */

    if(index===0){

        await interruption("early");

    }

    if(index===5){

        await interruption("afterFear");

    }

    if(index===7){

        await interruption("afterAlone");

    }

    if(index===10){

        await interruption("mid");

    }

    /* następne pytanie */

    if(index < questions.length-1){

        index++;

        locked=false;

        await wait(350);

        questionScene();

    }else{

        await finalSequence();

    }
}

function strongestWords(){

    const result=[];

    /* Najpierw rzeczy najbardziej osobiste */

    if(memory.fears.length){
        result.push(memory.fears[memory.fears.length-1]);
    }

    if(memory.people.length){
        result.push(memory.people[memory.people.length-1]);
    }

    if(memory.emotions.length){
        result.push(memory.emotions[memory.emotions.length-1]);
    }

    /* potem krótkie własne odpowiedzi */

    for(let i=memory.answers.length-1;i>=0;i--){

        const w=wordsOf(memory.answers[i]);

        for(let j=w.length-1;j>=0;j--){

            if(
                w[j].length>=5 &&
                !result.includes(w[j])
            ){
                result.push(w[j]);
            }

            if(result.length>=3) break;
        }

        if(result.length>=3) break;
    }

    return result.slice(0,3);
}

    await wait(1800);

    showText(
        "Albo zacząć jeszcze raz.",
        "Tym razem odpowiadając inaczej.",
        "MIRROR"
    );

    /* reset */

    const restart=document.createElement("button");

    restart.textContent="JESZCZE RAZ";

    restart.style.marginTop="35px";
    restart.style.padding="12px 25px";
    restart.style.background="#eee";
    restart.style.color="#000";
    restart.style.border="0";
    restart.style.cursor="pointer";
    restart.style.letterSpacing="2px";

    content.appendChild(restart);

    restart.addEventListener("click",()=>{
        location.reload();
    });
}


/* =========================================================
   MOUSE — EKRAN REAGUJE
========================================================= */

document.addEventListener("mousemove",e=>{

    if(!running) return;

    /* bardzo subtelne */

    const dx=(e.clientX/window.innerWidth-.5)*2;
    const dy=(e.clientY/window.innerHeight-.5)*2;

    if(Math.random()<.04){

        vignetteParallax(dx,dy);
    }

});

function vignetteParallax(dx,dy){

    app.style.transform=
        `translate(${dx*1.5}px,${dy*1.5}px)`;

    setTimeout(()=>{
        app.style.transform="";
    },80);
}


/* =========================================================
   KONIEC
========================================================= */

</script>
