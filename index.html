<!DOCTYPE html>
<html lang="pl">
<head>

<style>
/* =========================================================
   MIRROR
   INTERACTIVE PSYCHOLOGICAL HORROR
   VERSION 7
========================================================= */

:root{
    --white:#f4f4f4;
    --gray:#777;
    --dark:#080808;
    --red:#b00000;
    --deep-red:#310000;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--white);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    user-select:none;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            ellipse at center,
            #151515 0%,
            #080808 42%,
            #010101 100%
        );
    transition:
        background 900ms ease,
        filter 120ms ease,
        transform 100ms ease;
}

#world{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:5;
}

#grain{
    position:absolute;
    inset:-60%;
    z-index:100;
    pointer-events:none;
    opacity:.055;
    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.8) 0 1px,
            transparent 1px 4px
        );
    animation:
        grain .11s steps(2) infinite;
}

#scanlines{
    position:absolute;
    inset:0;
    z-index:99;
    pointer-events:none;
    opacity:.06;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.18) 4px
        );
}

#vignette{
    position:absolute;
    inset:0;
    z-index:98;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(0,0,0,.2) 52%,
            rgba(0,0,0,.97) 100%
        );
}

#flash{
    position:absolute;
    inset:0;
    z-index:500;
    pointer-events:none;
    opacity:0;
    background:#fff;
}

#redFlash{
    position:absolute;
    inset:0;
    z-index:501;
    pointer-events:none;
    opacity:0;
    background:#d00000;
    mix-blend-mode:screen;
}

#blackout{
    position:absolute;
    inset:0;
    z-index:490;
    pointer-events:none;
    opacity:0;
    background:#000;
}

#redAtmosphere{
    position:absolute;
    inset:-20%;
    z-index:2;
    pointer-events:none;
    opacity:0;
    background:
        radial-gradient(
            ellipse at center,
            rgba(160,0,0,.24),
            transparent 65%
        );
    transition:opacity 800ms ease;
}

#content{
    position:absolute;
    z-index:50;
    left:50%;
    top:50%;
    width:min(920px,90vw);
    min-height:520px;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#chapter{
    min-height:18px;
    margin-bottom:25px;
    color:#505050;
    font-size:10px;
    letter-spacing:6px;
    text-transform:uppercase;
    transition:opacity .25s;
}

#main{
    max-width:900px;
    min-height:76px;
    color:#eee;
    font-size:
        clamp(
            28px,
            4.5vw,
            64px
        );
    line-height:1.02;
    font-weight:600;
    letter-spacing:-1.5px;
    transition:
        opacity .2s,
        filter .2s,
        transform .2s;
}

#sub{
    max-width:700px;
    min-height:25px;
    margin-top:22px;
    color:#656565;
    font-size:14px;
    line-height:1.5;
    transition:opacity .2s;
}

#start{
    margin-top:45px;
    padding:15px 38px;
    border:1px solid #444;
    background:#080808;
    color:#eee;
    font-size:11px;
    letter-spacing:4px;
    cursor:pointer;
    transition:
        background .2s,
        color .2s,
        transform .2s,
        border .2s;
}

#start:hover{
    background:#eee;
    color:#000;
    border-color:#eee;
    transform:scale(1.04);
}

#input{
    width:min(640px,88vw);
    margin-top:43px;
    opacity:0;
    transform:translateY(15px);
    pointer-events:none;
    transition:
        opacity .3s,
        transform .3s;
}

#answer{
    width:100%;
    padding:13px 5px;
    border:0;
    border-bottom:1px solid #414141;
    outline:0;
    background:transparent;
    color:#fff;
    text-align:center;
    font-size:24px;
    letter-spacing:1px;
    user-select:text;
}

#answer::placeholder{
    color:#303030;
}

#answer:focus{
    border-bottom-color:#999;
}

#send{
    margin-top:24px;

    border:1px solid #444;
    background:#eee;
    color:#050505;
    font-size:10px;
    font-weight:bold;
    letter-spacing:3px;
    cursor:pointer;
}

#send:hover{
    transform:scale(1.04);
}

#progress{
    position:absolute;
    z-index:70;
    left:25px;
    bottom:24px;
    width:200px;
    height:2px;
    background:#181818;
}

#progressFill{
    width:0%;
    height:100%;

}

#counter{

    z-index:70;
    right:25px;
    bottom:18px;

}

#cursorGhost{

    height:5px;
    border-radius:50%;

    opacity:0;
    pointer-events:none;
    box-shadow:0 0 14px rgba(255,255,255,.6);
}

#redPoint{
    position:absolute;
    z-index:600;
    width:6px;
    height:6px;
    background:#f00;
    opacity:0;
    box-shadow:
        0 0 5px #f00,
        0 0 20px #f00;
}

#giant{
    position:absolute;
    z-index:400;
    left:50%;
    top:50%;
    width:95vw;
    transform:translate(-50%,-50%);
    text-align:center;
    opacity:0;
    color:#fff;
    font-size:
        clamp(
            40px,
            10vw,
            145px
        );
    font-weight:900;
    line-height:.9;
    letter-spacing:7px;
    pointer-events:none;
    text-shadow:
        5px 0 #800,
        -4px 0 #099;
}

#entities{
    position:absolute;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.entity{
    position:absolute;
    opacity:0;
    color:#777;
    white-space:nowrap;
    font-size:10px;
    letter-spacing:4px;
}

.entity.big{
    color:#ddd;
    font-size:
        clamp(
            35px,
            7vw,
            105px
        );
    font-weight:900;
    letter-spacing:7px;
}

.entity.red{
    color:#b00000;
}

.entity.white{
    color:#eee;
}

.entity.blur{
    filter:blur(5px);
}

.entity.fade{
    animation:
        entityFade 1.6s ease forwards;
}

.entity.rise{
    animation:
        entityRise 1.5s ease forwards;
}

.entity.fall{
    animation:
        entityFall 1.3s ease forwards;
}

.entity.cross{
    animation:
        entityCross 1.8s linear forwards;
}

.entity.spin{
    animation:
        entitySpin 1.5s ease forwards;
}

body.red #app{
    background:
        radial-gradient(
            ellipse at center,
            #270000 0%,
            #0d0000 45%,
            #010000 100%
        );
}

body.red #redAtmosphere{
    opacity:1;
}

body.dark #main{
    color:#151515;
}

.glitchMain{
    animation:
        glitchMain .095s steps(2) infinite;
}

.shake{
    animation:
        shake .075s infinite;
}

.hardShake{
    animation:
        hardShake .045s infinite;
}

.flicker{
    animation:
        flicker .12s steps(2) infinite;
}

.invisible{
    opacity:0 !important;
}

.noTransition{
    transition:none !important;
}

@keyframes grain{
    0%{
        transform:translate(0,0);
    }
    25%{
        transform:translate(3%,-2%);
    }
    50%{
        transform:translate(-2%,3%);
    }
    75%{
        transform:translate(2%,2%);
    }
    100%{
        transform:translate(0,0);
    }
}

@keyframes glitchMain{
    0%{
        transform:translate(0,0);
        text-shadow:none;
    }
    20%{
        transform:translate(7px,-2px);
        text-shadow:
            -5px 0 #a00,
            5px 0 #099;
    }
    40%{
        transform:translate(-8px,2px);
        text-shadow:
            5px 0 #a00,
            -5px 0 #099;
    }
    60%{
        transform:translate(4px,3px);
    }
    80%{
        transform:translate(-3px,-3px);
    }
    100%{
        transform:translate(0,0);
    }
}

@keyframes shake{
    0%{
        transform:translate(-50%,-50%);
    }
    25%{
        transform:
            translate(
                calc(-50% + 5px),
                calc(-50% - 3px)
            );
    }
    50%{
        transform:
            translate(
                calc(-50% - 4px),
                calc(-50% + 4px)
            );
    }
    75%{
        transform:
            translate(
                calc(-50% + 3px),
                calc(-50% + 2px)
            );
    }
    100%{
        transform:translate(-50%,-50%);
    }
}

@keyframes hardShake{
    0%{
        transform:translate(-50%,-50%);
    }
    20%{
        transform:
            translate(
                calc(-50% + 19px),
                calc(-50% - 11px)
            )
            rotate(.5deg);
    }
    40%{
        transform:
            translate(
                calc(-50% - 17px),
                calc(-50% + 12px)
            )
            rotate(-.7deg);
    }
    60%{
        transform:
            translate(
                calc(-50% + 13px),
                calc(-50% + 16px)
            );
    }
    80%{
        transform:
            translate(
                calc(-50% - 10px),
                calc(-50% - 8px)
            );
    }
    100%{
        transform:translate(-50%,-50%);
    }
}

@keyframes flicker{
    0%,100%{
        opacity:1;
    }
    12%{
        opacity:.08;
    }
    24%{
        opacity:.9;
    }
    40%{
        opacity:.02;
    }
    57%{
        opacity:.75;
    }
    71%{
        opacity:.1;
    }
    83%{
        opacity:.9;
    }
}

@keyframes entityFade{
    0%{
        opacity:0;
        transform:scale(.7);
    }
    15%{
        opacity:1;
    }
    75%{
        opacity:.7;
    }
    100%{
        opacity:0;
        transform:scale(1.2);
    }
}

@keyframes entityRise{
    0%{
        opacity:0;
        transform:
            translateY(70px)
            scale(.7);
    }
    15%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:
            translateY(-150px)
            scale(1.2);
    }
}

@keyframes entityFall{
    0%{
        opacity:0;
        transform:
            translateY(-120px)
            rotate(0);
    }
    15%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:
            translateY(170px)
            rotate(30deg);
    }
}

@keyframes entityCross{
    0%{
        opacity:0;
        transform:translateX(-100vw);
    }
    15%{
        opacity:1;
    }
    85%{
        opacity:.5;
    }
    100%{
        opacity:0;
        transform:translateX(100vw);
    }
}

@keyframes entitySpin{
    0%{
        opacity:0;
        transform:
            scale(.4)
            rotate(-90deg);
    }
    20%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:
            scale(1.5)
            rotate(90deg);
    }
}
</style>
</head>

<script>
"use strict";

/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);

const app          = $("app");
const chapter      = $("chapter");
const mainText     = $("main");
const subText      = $("sub");
const startButton  = $("start");
const inputBox     = $("input");
const answerInput  = $("answer");
const sendButton   = $("send");
const progressFill = $("progressFill");
const counter      = $("counter");
const flash        = $("flash");
const redFlash     = $("redFlash");
const blackout     = $("blackout");
const giant        = $("giant");
const entities     = $("entities");
const redPoint     = $("redPoint");
const cursorGhost  = $("cursorGhost");

/* =========================================================
   STATE
========================================================= */

const state = {

    running:false,

    locked:false,

    questionIndex:-1,

    sceneToken:0,

    destroyed:false,

    audioStarted:false,

    audioSuspended:false,

    tension:0,

    typing:0,

    answerStart:0,

    lastAnswer:"",

    answers:[],

    memory:{

        morning:"",
        mood:"",
        person:"",
        desire:"",
        fear:"",
        loss:"",
        alone:"",
        object:"",
        sound:"",
        trust:"",
        need:"",
        change:"",
        happy:"",
        honest:"",
        truth:"",
        finalChoice:""

    },

    flags:{

        repeatedFear:false,
        repeatedPerson:false,
        repeatedDesire:false,
        lied:false,
        aloneYes:false,
        changedAnswer:false

    },

    history:[],

    timers:[],

    ambience:null,

    final:false

};


/* =========================================================
   QUESTION DATABASE
========================================================= */

const questions = [

    {
        id:"morning",
        chapter:"POCZĄTEK",
        text:"Co zrobiłeś dziś rano?",
        placeholder:"jedno słowo"
    },

    {
        id:"mood",
        chapter:"POCZĄTEK",
        text:"Jak się teraz czujesz?",
        placeholder:"jedno słowo"
    },

    {
        id:"person",
        chapter:"LUDZIE",
        text:"Kto jest dla Ciebie ważny?",
        placeholder:"jedno słowo"
    },

    {
        id:"desire",
        chapter:"POTRZEBA",
        text:"Czego teraz chcesz?",
        placeholder:"jedno słowo"
    },

    {
        id:"fear",
        chapter:"PĘKNIĘCIE",
        text:"Czego najbardziej się boisz?",
        placeholder:"jedno słowo"
    },

    {
        id:"loss",
        chapter:"PĘKNIĘCIE",
        text:"Czego nie chcesz stracić?",
        placeholder:"jedno słowo"
    },

    {
        id:"alone",
        chapter:"ODLEGŁOŚĆ",
        text:"Czy jesteś teraz sam?",
        placeholder:"tak / nie"
    },

    {
        id:"object",
        chapter:"TERAZ",
        text:"Czego dotykasz?",
        placeholder:"jedno słowo"
    },

    {
        id:"sound",
        chapter:"TERAZ",
        text:"Co słyszysz?",
        placeholder:"jedno słowo"
    },

    {
        id:"trust",
        chapter:"ZBLIŻENIE",
        text:"Komu ufasz?",
        placeholder:"jedno słowo"
    },

    {
        id:"need",
        chapter:"ZBLIŻENIE",
        text:"Czego Ci brakuje?",
        placeholder:"jedno słowo"
    },

    {
        id:"change",
        chapter:"ZBLIŻENIE",
        text:"Co chciałbyś zmienić?",
        placeholder:"jedno słowo"
    },

    {
        id:"happy",
        chapter:"SPRAWDZENIE",
        text:"Jesteś szczęśliwy?",
        placeholder:"tak / nie / czasami"
    },

    {
        id:"honest",
        chapter:"SPRAWDZENIE",
        text:"Która odpowiedź była najtrudniejsza?",
        placeholder:"numer albo słowo"
    },

    {
        id:"truth",
        chapter:"SPRAWDZENIE",
        text:"Skłamałeś choć raz?",
        placeholder:"tak / nie"
    },

    {
        id:"finalChoice",
        chapter:"OSTATNIE",
        text:"Co zabrałbyś ze sobą, gdyby wszystko inne zniknęło?",
        placeholder:"jedno słowo"
    }

];


/* =========================================================
   AUDIO ENGINE
========================================================= */

let AC = null;

let master = null;

let ambienceGain = null;

let droneA = null;

let droneB = null;

let droneFilter = null;

let droneLFO = null;

let droneLFOGain = null;

let audioReady = false;


/* =========================================================
   AUDIO INIT
========================================================= */

function initAudio(){

    if(audioReady)
        return true;

    try{

        const Ctx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!Ctx)
            return false;

        AC = new Ctx();

        master = AC.createGain();

        master.gain.value = .30;

        master.connect(
            AC.destination
        );

        createAmbience();

        audioReady=true;

        return true;

    }catch(error){

        console.warn(
            "Audio init failed:",
            error
        );

        return false;
    }
}


async function resumeAudio(){

    if(!AC)
        return;

    try{

        if(
            AC.state === "suspended"
        ){
            await AC.resume();
        }

        state.audioSuspended=false;

    }catch(error){

        state.audioSuspended=true;

    }
}


/* =========================================================
   SAFE AUDIO TIME
========================================================= */

function audioTime(){

    if(!AC)
        return 0;

    return AC.currentTime;
}


/* =========================================================
   MASTER
========================================================= */

function masterVolume(value,duration=.25){

    if(!master || !AC)
        return;

    const now=audioTime();

    master.gain.cancelScheduledValues(now);

    master.gain.setValueAtTime(
        Math.max(.0001,master.gain.value),
        now
    );

    master.gain.linearRampToValueAtTime(
        Math.max(.0001,value),
        now+duration
    );
}


/* =========================================================
   AMBIENCE
========================================================= */

function createAmbience(){

    if(!AC)
        return;

    ambienceGain=AC.createGain();

    ambienceGain.gain.value=.0001;

    ambienceGain.connect(master);


    droneA=AC.createOscillator();

    droneB=AC.createOscillator();

    droneFilter=AC.createBiquadFilter();

    droneLFO=AC.createOscillator();

    droneLFOGain=AC.createGain();


    droneA.type="sine";

    droneB.type="triangle";

    droneA.frequency.value=43;

    droneB.frequency.value=61;

    droneFilter.type="lowpass";

    droneFilter.frequency.value=500;

    droneLFO.frequency.value=.06;

    droneLFOGain.gain.value=120;


    droneA.connect(droneFilter);

    droneB.connect(droneFilter);

    droneFilter.connect(ambienceGain);

    droneLFO.connect(droneLFOGain);

    droneLFOGain.connect(
        droneFilter.frequency
    );


    droneA.start();

    droneB.start();

    droneLFO.start();
}


/* =========================================================
   AMBIENCE LEVEL
========================================================= */

function ambience(level=.02){

    if(!ambienceGain || !AC)
        return;

    const now=audioTime();

    ambienceGain.gain.cancelScheduledValues(now);

    ambienceGain.gain.linearRampToValueAtTime(
        Math.max(.0001,level),
        now+.8
    );
}


function silenceAmbience(){

    ambience(.0001);
}


/* =========================================================
   TONE
========================================================= */

function playTone(
    frequency,
    duration=.2,
    volume=.04,
    type="sine",
    delay=0
){

    if(!AC || !master)
        return;

    try{

        const osc=
            AC.createOscillator();

        const gain=
            AC.createGain();

        const start=
            audioTime()+delay;

        osc.type=type;

        osc.frequency.setValueAtTime(
            Math.max(20,frequency),
            start
        );

        gain.gain.setValueAtTime(
            .0001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            Math.max(.0002,volume),
            start+.015
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            start+duration
        );

        osc.connect(gain);

        gain.connect(master);

        osc.start(start);

        osc.stop(
            start+duration+.08
        );

    }catch(error){}

}


/* =========================================================
   SWEEP
========================================================= */

function playSweep(
    from,
    to,
    duration=.8,
    volume=.05,
    type="sawtooth"
){

    if(!AC || !master)
        return;

    try{

        const osc=
            AC.createOscillator();

        const gain=
            AC.createGain();

        const start=
            audioTime();

        osc.type=type;

        osc.frequency.setValueAtTime(
            Math.max(20,from),
            start
        );

        osc.frequency.exponentialRampToValueAtTime(
            Math.max(20,to),
            start+duration
        );

        gain.gain.setValueAtTime(
            .0001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            start+.03
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            start+duration
        );

        osc.connect(gain);

        gain.connect(master);

        osc.start(start);

        osc.stop(

        );

    }catch(error){}
}

/* =========================================================
   NOISE
========================================================= */

function playNoise(
    duration=.25,
    volume=.05,
    filterFrequency=1000,
    delay=0
){

    if(!AC || !master)
        return;

    try{

        const buffer=
            AC.createBuffer(
                1,
                Math.floor(
                    AC.sampleRate*duration
                ),
                AC.sampleRate
            );

        const data=
            buffer.getChannelData(0);

        for(
            let i=0;
            i<data.length;
            i++
        ){

            data[i]=
                Math.random()*2-1;
        }


        const source=
            AC.createBufferSource();

        const filter=
            AC.createBiquadFilter();

        const gain=
            AC.createGain();


        source.buffer=buffer;

        filter.type="bandpass";

        filter.frequency.value=
            filterFrequency;

        filter.Q.value=1.2;


        const start=
            audioTime()+delay;


        gain.gain.setValueAtTime(
            .0001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            start+.015
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            start+duration
        );


        source.connect(filter);

        filter.connect(gain);

        gain.connect(master);

        source.start(start);

    }catch(error){}
}

/* =========================================================
   MEMORY
========================================================= */

function normalize(
    value
){

    return value
        .trim()
        .replace(
            /\s+/g,
            " "
        )
        .slice(
            0,
            100
        );
}


function saveAnswer(
    question,
    value
){

    const v=
        normalize(value);

    state.answers.push(v);

    state.history.push({
        id:question.id,
        value:v,
        time:
            Date.now()
    });

    state.memory[
        question.id
    ]=v;


    if(
        state.answers.length>1 &&
        state.answers[
            state.answers.length-2
        ].toLowerCase()===
        v.toLowerCase()
    ){

        state.flags.changedAnswer=true;
    }


    const low=v.toLowerCase();


    if(
        question.id==="fear" &&
        state.memory.loss &&
        low===
        state.memory.loss.toLowerCase()
    ){

        state.flags.repeatedFear=true;
    }


    if(
        question.id==="person" &&
        state.memory.trust &&
        low===
        state.memory.trust.toLowerCase()
    ){

        state.flags.repeatedPerson=true;
    }


    if(
        question.id==="desire" &&
        state.memory.need &&
        low===
        state.memory.need.toLowerCase()
    ){

        state.flags.repeatedDesire=true;
    }


    if(
        question.id==="alone" &&
        (
            low==="tak" ||
            low==="yes"
        )
    ){

        state.flags.aloneYes=true;
    }


    if(
        question.id==="truth" &&
        (
            low==="tak" ||
            low==="yes"
        )
    ){

        state.flags.lied=true;
    }
}


/* =========================================================
   VALIDATION
========================================================= */

function validAnswer(
    value,
    question
){

    const v=
        normalize(value);

    if(!v)
        return false;

    const low=
        v.toLowerCase();


    if(
        question.id==="alone" ||
        question.id==="truth"
    ){

        return [
            "tak",
            "nie",
            "yes",
            "no",
            "nie wiem"
        ].includes(low);
    }


    if(
        question.id==="happy"
    ){

        return [
            "tak",
            "nie",
            "czasami",
            "czasem",
            "yes",
            "no"
        ].includes(low);
    }


    if(v.length<2)
        return false;


    if(
        /^(.)\1{5,}$/i.test(v)
    )
        return false;


    if(
        /^[0-9]+$/.test(v)
    )
        return false;


    return true;
}

/* =========================================================
   QUESTION PRESENTATION
========================================================= */

async function showQuestion(){

    if(!state.running)
        return;

    const question=
        questions[
            state.questionIndex
        ];

    if(!question)
        return;


    state.locked=true;

    state.sceneToken++;

    const token=
        state.sceneToken;


    updateProgress();

    hideInput();

    mainText.style.opacity="0";

    subText.style.opacity="0";

    chapter.style.opacity="0";


    chapter.textContent=
        question.chapter;

    mainText.textContent=
        question.text;

    subText.textContent=
        question.placeholder;


    const delay=
        question.id==="alone" ||
        question.id==="truth"
            ?450
            :170;


    await wait(delay);


    if(
        token!==state.sceneToken ||
        !state.running
    )
        return;


    mainText.style.opacity="1";

    chapter.style.opacity="1";

    subText.style.opacity="1";


    await questionAudio(
        question
    );


    await wait(260);


    if(
        token!==state.sceneToken ||
        !state.running
    )
        return;


    showInput(
        question.placeholder
    );


    state.answerStart=
        performance.now();

    state.locked=false;
}

                }

                .8,
                .13

            if(
                state.memory.desire &&

                850,
                1.1,
                .06,
                "sawtooth"
            );

                state.memory.fear &&

                redMode(false);

            }else{

                    value,
                    {
                        big:true
                    }
                );
            }

            await wait(600);

            break;


        /* -------------------------------------------------
           HAPPY
        ------------------------------------------------- */

        case"happy":

            await wait(350);

                playTone(
                    620,
                    .3,
                    .025,
                    "sine"
                );

                    "Dobrze.",

                    .7,
                    .13

                );

                    "Czasami.",
                    "Najbardziej uczciwa odpowiedź.",
                    "SPRAWDZENIE"
                );
            }

            await wait(850);

            break;


        /* -------------------------------------------------
           HONEST
        ------------------------------------------------- */

        case"honest":

            silenceScene();

            await wait(500);

            setText(
                "Nie sprawdzam.",
                "",
                "SPRAWDZENIE"
            );

            await wait(600);

            playTone(
                150,
                .45,
                .02,

            restoreScene();

            break;


        /* -------------------------------------------------
           TRUTH
        ------------------------------------------------- */

        case"truth":

        /* -------------------------------------------------
           FINAL
        ------------------------------------------------- */

        case"finalChoice":

            state.tension+=2;

            );

/* =========================================================
   RANDOM MICRO EVENTS
========================================================= */

function randomMicroEvent(){

    if(
        !state.running ||
        state.locked ||
        state.final
    )
        return;


    const r=
        Math.random();


    if(
        r<.12
    ){

        ghostCursor();

        return;
    }


    if(
        r<.20
    ){

        spawnEntity(
            "·",
            {
                animation:"fade",
                life:800
            }
        );

        return;
    }


    if(
        r<.27 &&
        state.tension>=2
    ){

        digitalBurst();

        flickerScreen(
            100
        );

        return;
    }


    if(
        r<.31 &&
        state.tension>=3
    ){

        showRedPoint();

        playTone(
            90,
            .18,
            .035,
            "square"
        );

        return;
    }


    if(
        r<.34 &&
        state.tension>=4
    ){

        spawnEntity(
            "NIE",
            {
                big:true,
                red:true,
                animation:"cross",
                life:1900
            }
        );

        return;
    }
}

   MICRO EVENT LOOP
========================================================= */

setInterval(

    900
);


/* =========================================================
   TYPING EFFECTS
========================================================= */

answerInput.addEventListener(
    "input",
    ()=>{

        if(

        )

        ghostCursor();

        ){

                    life:1000
                }
            );
        }


        if(
            state.typing===27
        ){

            );
        }


        if(
            state.typing>35 &&
            Math.random()<.05
        ){

        }
    }
);


/* =========================================================
   SUBMIT
========================================================= */

async function submitAnswer(){

    if(
        !state.running ||
        state.locked ||
        state.final
    )
        return;


    const question=
        questions[
            state.questionIndex
        ];


    if(!question)
        return;


    const value=
        normalize(
            answerInput.value
        );


    if(
        !validAnswer(
            value,
            question
        )
    ){

        answerInput.style.borderBottomColor=
            "#900";

        playTone(
            85,
            .16,
            .045,
            "square"
        );

        await wait(220);

        answerInput.style.borderBottomColor=
            "#414141";

        answerInput.focus();

        return;
    }


    state.locked=true;

    hideInput();


    const elapsed=
        performance.now()-
        state.answerStart;


    state.lastAnswer=value;

    saveAnswer(
        question,
        value
    );


    playTone(
        1600,
        .025,
        .035,
        "square"
    );


    await wait(160);


    await reaction(
        question,
        value
    );


    /* -----------------------------------------------------
       BEZPIECZNE PRZEJŚCIE
    ----------------------------------------------------- */

    if(
        state.questionIndex<
        questions.length-1
    ){

        state.questionIndex++;

        await wait(300);

        state.locked=false;

        showQuestion();

    }else{

        state.locked=true;

        await finale();
    }
}
