<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MIRROR — DO NOT LOOK AWAY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030303;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    transition:filter .15s,background .5s;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 48%,#141414 0%,#070707 43%,#010101 100%);
}

#grain{
    position:absolute;
    inset:-50%;
    z-index:90;
    pointer-events:none;
    opacity:.045;
    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.8) 0 1px,
            transparent 1px 4px
        );
    animation:grain .14s steps(2) infinite;
}

#scan{
    position:absolute;
    inset:0;
    z-index:89;
    pointer-events:none;
    opacity:.08;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.12) 4px
        );
}

#vignette{
    position:absolute;
    inset:0;
    z-index:88;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.25) 55%,
            rgba(0,0,0,.94) 100%
        );
}

#flash,
#redFlash{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
}

#flash{
    z-index:200;
    background:#fff;
}

#redFlash{
    z-index:201;
    background:#b00000;
    mix-blend-mode:screen;
}

#content{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(900px,90vw);
    min-height:460px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:30;
}

#chapter{
    min-height:18px;
    margin-bottom:24px;
    color:#555;
    font-size:10px;
    letter-spacing:6px;
    text-transform:uppercase;
}

#main{
    min-height:75px;
    max-width:900px;
    font-size:clamp(28px,4.4vw,62px);
    line-height:1.02;
    font-weight:600;
    letter-spacing:-1.5px;
    text-shadow:0 0 35px rgba(255,255,255,.04);
}

#sub{
    min-height:25px;
    max-width:680px;
    margin-top:20px;
    color:#666;
    font-size:14px;
    line-height:1.5;
}

#input{
    width:min(620px,85vw);
    margin-top:42px;
    opacity:0;
    transform:translateY(15px);
    pointer-events:none;
    transition:.3s;
}

#answer{
    width:100%;
    padding:12px 5px;
    border:0;
    border-bottom:1px solid #444;
    outline:0;
    background:transparent;
    color:#fff;
    text-align:center;
    font-size:25px;
    letter-spacing:1px;
}

#answer:focus{
    border-bottom-color:#aaa;
}

#answer::placeholder{
    color:#303030;
}

#send{
    margin-top:23px;
    border:1px solid #444;
    background:#eee;
    color:#050505;
    padding:12px 28px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
    letter-spacing:3px;
    transition:.2s;
}

#send:hover{
    transform:scale(1.05);
}

#send:active{
    transform:scale(.94);
}

#start{
    margin-top:42px;
    padding:14px 34px;
    background:#070707;
    border:1px solid #555;
    color:#eee;
    letter-spacing:4px;
    cursor:pointer;
    transition:.25s;
}

#start:hover{
    color:#000;
    background:#eee;
}

#bar{
    position:absolute;
    left:25px;
    bottom:23px;
    width:190px;
    height:2px;
    background:#181818;
    z-index:40;
}

#barFill{
    height:100%;
    width:0%;
    background:#aaa;
    transition:width 1s;
}

#count{
    position:absolute;
    right:25px;
    bottom:18px;
    z-index:40;
    color:#444;
    font-size:10px;
    letter-spacing:3px;
}

#cursorDot{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#aaa;
    pointer-events:none;
    opacity:0;
    z-index:250;
    box-shadow:0 0 10px rgba(255,255,255,.5);
}

#objects,
#words{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#objects{
    z-index:20;
}

#words{
    z-index:120;
}

.floating{
    position:absolute;
    opacity:0;
    white-space:nowrap;
    color:#777;
    font-size:11px;
    letter-spacing:4px;
}

.floating.big{
    font-size:clamp(35px,7vw,100px);
    font-weight:900;
    color:#ddd;
    letter-spacing:8px;
}

#warning{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:300;
    pointer-events:none;
    opacity:0;
    font-size:clamp(38px,9vw,125px);
    font-weight:900;
    letter-spacing:8px;
    color:white;
    text-shadow:
        5px 0 #900,
        -4px 0 #0aa;
}

#redDot{
    position:absolute;
    z-index:250;
    width:6px;
    height:6px;
    background:#f00;
    box-shadow:0 0 20px #f00;
    opacity:0;
}

.red #app{
    background:
        radial-gradient(circle at 50% 48%,#280000 0%,#090000 48%,#010000 100%);
}

.dark #main{
    color:#222;
}

.glitch{
    animation:glitch .1s steps(2) infinite;
}

.shake{
    animation:shake .08s infinite;
}

.hardShake{
    animation:hardShake .055s infinite;
}

.flicker{
    animation:flicker .13s steps(2) infinite;
}

@keyframes grain{
    0%{transform:translate(0,0)}
    25%{transform:translate(3%,-2%)}
    50%{transform:translate(-3%,3%)}
    75%{transform:translate(2%,4%)}
    100%{transform:translate(0,0)}
}

@keyframes glitch{
    0%{transform:translate(-50%,-50%)}
    20%{transform:translate(calc(-50% + 10px),-50%) skew(5deg)}
    40%{transform:translate(calc(-50% - 8px),calc(-50% + 2px)) skew(-5deg)}
    60%{transform:translate(-50%,calc(-50% - 5px)) skew(2deg)}
    80%{transform:translate(calc(-50% + 4px),-50%)}
    100%{transform:translate(-50%,-50%)}
}

@keyframes shake{
    0%{transform:translate(-50%,-50%)}
    25%{transform:translate(calc(-50% + 4px),calc(-50% - 3px))}
    50%{transform:translate(calc(-50% - 4px),calc(-50% + 2px))}
    75%{transform:translate(calc(-50% + 3px),calc(-50% + 4px))}
    100%{transform:translate(-50%,-50%)}
}

@keyframes hardShake{
    0%{transform:translate(-50%,-50%)}
    20%{transform:translate(calc(-50% + 17px),calc(-50% - 9px))}
    40%{transform:translate(calc(-50% - 15px),calc(-50% + 12px))}
    60%{transform:translate(calc(-50% + 11px),calc(-50% + 15px))}
    80%{transform:translate(calc(-50% - 8px),calc(-50% - 7px))}
    100%{transform:translate(-50%,-50%)}
}

@keyframes flicker{
    0%,100%{opacity:1}
    12%{opacity:.15}
    24%{opacity:.9}
    41%{opacity:.03}
    65%{opacity:.8}
    78%{opacity:.1}
}

@keyframes floatAway{
    0%{
        opacity:0;
        transform:translateY(30px) scale(.7);
    }
    15%{opacity:1}
    80%{opacity:.7}
    100%{
        opacity:0;
        transform:translateY(-150px) scale(1.3) rotate(4deg);
    }
}

@keyframes fall{
    0%{
        opacity:0;
        transform:translateY(-100px) rotate(0);
    }
    20%{opacity:1}
    100%{
        opacity:0;
        transform:translateY(160px) rotate(30deg);
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="grain"></div>
    <div id="scan"></div>
    <div id="vignette"></div>

    <div id="flash"></div>
    <div id="redFlash"></div>

    <div id="objects"></div>
    <div id="words"></div>

    <div id="warning"></div>
    <div id="redDot"></div>
    <div id="cursorDot"></div>

    <div id="content">

        <div id="chapter">MIRROR</div>

        <div id="main">
            Nie będę Ci niczego tłumaczyć.
        </div>

        <div id="sub">
            Po prostu odpowiadaj.
        </div>

        <button id="start">
            ROZPOCZNIJ
        </button>

        <div id="input">

            <input
                id="answer"
                type="text"
                autocomplete="off"
                spellcheck="false"
                maxlength="100"
                placeholder="jedno słowo"
            >

            <button id="send">
                DALEJ
            </button>

        </div>

    </div>

    <div id="bar">
        <div id="barFill"></div>
    </div>

    <div id="count">00 / 00</div>

</div>

<script>

/* ==========================================================
   MIRROR — VERSION "THE DESCENT"

   Całość działa lokalnie.
   Audio generowane przez Web Audio API.
   Brak API / kamery / mikrofonu / geolokalizacji.
========================================================== */

const $ = id => document.getElementById(id);

const app = $("app");
const content = $("content");
const chapter = $("chapter");
const main = $("main");
const sub = $("sub");
const start = $("start");
const input = $("input");
const answer = $("answer");
const send = $("send");
const barFill = $("barFill");
const count = $("count");
const flash = $("flash");
const redFlash = $("redFlash");
const objects = $("objects");
const words = $("words");
const warning = $("warning");
const redDot = $("redDot");
const cursorDot = $("cursorDot");

let running = false;
let locked = false;
let qIndex = -1;

const memory = {

    answers: [],

    /* rzeczy, które użytkownik sam wybrał */
    fear: "",
    person: "",
    desire: "",
    loss: "",
    need: "",
    morning: "",
    happiness: "",
    alone: "",

    /* odpowiedzi pomocnicze */
    emotionalWords: [],
    strongWords: [],

    /* czy zmienił odpowiedź */
    changed: false,

    /* czas odpowiedzi */
    times: [],

    lastQuestionStart: 0
};


/* ==========================================================
   AUDIO
========================================================== */

let AC = null;
let master = null;

let musicGain = null;
let musicOsc1 = null;
let musicOsc2 = null;
let musicLfo = null;

let audioReady = false;

function initAudio(){

    if(audioReady) return;

    try{

        AC = new (window.AudioContext || window.webkitAudioContext)();

        master = AC.createGain();
        master.gain.value = .32;

        master.connect(AC.destination);

        audioReady = true;

        createMusic();

    }catch(e){

        console.log("Audio unavailable");

    }
}

function t(){
    return AC ? AC.currentTime : 0;
}

function tone(
    frequency,
    duration,
    volume=.05,
    type="sine",
    delay=0
){

    if(!AC) return;

    const osc = AC.createOscillator();
    const gain = AC.createGain();

    const startTime = t()+delay;

    osc.type = type;

    osc.frequency.setValueAtTime(
        frequency,
        startTime
    );

    gain.gain.setValueAtTime(
        .0001,
        startTime
    );

    gain.gain.exponentialRampToValueAtTime(
        Math.max(.0002,volume),
        startTime+.015
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        startTime+duration
    );

    osc.connect(gain);
    gain.connect(master);

    osc.start(startTime);
    osc.stop(startTime+duration+.05);
}

function sweep(
    from,
    to,
    duration=.8,
    volume=.05,
    type="sine"
){

    if(!AC) return;

    const osc = AC.createOscillator();
    const gain = AC.createGain();

    const startTime=t();

    osc.type=type;

    osc.frequency.setValueAtTime(
        from,
        startTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        Math.max(20,to),
        startTime+duration
    );

    gain.gain.setValueAtTime(.0001,startTime);

    gain.gain.exponentialRampToValueAtTime(
        volume,
        startTime+.04
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        startTime+duration
    );

    osc.connect(gain);
    gain.connect(master);

    osc.start(startTime);
    osc.stop(startTime+duration+.05);
}

function noise(
    duration=.25,
    volume=.06,
    frequency=1000,
    delay=0
){

    if(!AC) return;

    const buffer=AC.createBuffer(
        1,
        Math.floor(AC.sampleRate*duration),
        AC.sampleRate
    );

    const data=buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
        data[i]=Math.random()*2-1;
    }

    const source=AC.createBufferSource();
    const filter=AC.createBiquadFilter();
    const gain=AC.createGain();

    source.buffer=buffer;

    filter.type="bandpass";
    filter.frequency.value=frequency;
    filter.Q.value=1.5;

    const startTime=t()+delay;

    gain.gain.setValueAtTime(.0001,startTime);

    gain.gain.exponentialRampToValueAtTime(
        volume,
        startTime+.015
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        startTime+duration
    );

    source.connect(filter);
    filter.connect(gain);
    gain.connect(master);

    source.start(startTime);
}

function bass(
    frequency=40,
    duration=.8,
    volume=.18
){

    if(!AC) return;

    const osc=AC.createOscillator();
    const gain=AC.createGain();

    const startTime=t();

    osc.type="sine";

    osc.frequency.setValueAtTime(
        frequency,
        startTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        Math.max(20,frequency*.6),
        startTime+duration
    );

    gain.gain.setValueAtTime(.0001,startTime);

    gain.gain.exponentialRampToValueAtTime(
        volume,
        startTime+.025
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        startTime+duration
    );

    osc.connect(gain);
    gain.connect(master);

    osc.start(startTime);
    osc.stop(startTime+duration+.1);
}


/* ---------- MUSIC ---------- */

function createMusic(){

    if(!AC) return;

    musicGain=AC.createGain();
    musicGain.gain.value=.0001;

    musicGain.connect(master);

    musicOsc1=AC.createOscillator();
    musicOsc2=AC.createOscillator();

    musicOsc1.type="sine";
    musicOsc2.type="triangle";

    musicOsc1.frequency.value=48;
    musicOsc2.frequency.value=73;

    musicOsc1.connect(musicGain);
    musicOsc2.connect(musicGain);

    musicOsc1.start();
    musicOsc2.start();

    /* bardzo wolne pulsowanie */

    musicLfo=AC.createOscillator();

    const lfoGain=AC.createGain();

    musicLfo.frequency.value=.075;
    lfoGain.gain.value=.012;

    musicLfo.connect(lfoGain);
    lfoGain.connect(musicGain.gain);

    musicLfo.start();
}

function music(level=.025){

    if(!musicGain) return;

    musicGain.gain.cancelScheduledValues(t());

    musicGain.gain.linearRampToValueAtTime(
        level,
        t()+1
    );
}

function musicStop(){

    if(!musicGain) return;

    musicGain.gain.cancelScheduledValues(t());

    musicGain.gain.linearRampToValueAtTime(
        .0001,
        t()+.12
    );
}

function musicDrop(){

    musicStop();

    bass(32,.6,.15);
}

function musicRestore(level=.035){

    music(level);
}


/* ---------- SOUND EVENTS ---------- */

function click(){

    tone(1600,.025,.045,"square");
    tone(800,.045,.025,"square",.025);
}

function softClick(){

    tone(700,.05,.025,"triangle");
}

function heartbeat(){

    bass(52,.12,.14);

    setTimeout(()=>{
        bass(43,.11,.10);
    },150);
}

function heartbeatDouble(){

    heartbeat();

    setTimeout(()=>{
        heartbeat();
    },330);
}

function metalHit(){

    tone(880,.35,.09,"square");
    tone(1320,.24,.055,"square",.035);
    tone(420,.45,.06,"triangle",.1);
}

function needle(){

    tone(3300,.14,.045,"sine");
    tone(4100,.10,.03,"sine",.16);
}

function digitalNoise(){

    for(let i=0;i<9;i++){

        tone(
            120+Math.random()*2000,
            .025+Math.random()*.05,
            .018,
            Math.random()>.5?"square":"sawtooth",
            i*.045
        );
    }
}

function whisperSound(){

    noise(.7,.035,700);
    tone(110,.8,.025,"triangle");
}

function heavyImpact(){

    bass(28,.85,.34);
    noise(.45,.22,150);
    noise(.18,.12,700,.08);
    tone(60,.65,.12,"sawtooth");
}

function risingTension(){

    sweep(50,800,2.2,.055,"sawtooth");

    setTimeout(()=>{
        heartbeat();
    },700);

    setTimeout(()=>{
        heartbeat();
    },1100);

    setTimeout(()=>{
        heartbeatDouble();
    },1500);
}


/* ==========================================================
   VISUAL ENGINE
========================================================== */

function wait(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

function flashScreen(color="white",duration=70){

    const el=color==="red"?redFlash:flash;

    el.style.transition="none";
    el.style.opacity="1";

    setTimeout(()=>{

        el.style.transition=
            `opacity ${duration/1000}s ease`;

        el.style.opacity="0";

    },20);
}

function shake(ms=300,strong=false){

    content.classList.remove("shake","hardShake");

    void content.offsetWidth;

    content.classList.add(
        strong?"hardShake":"shake"
    );

    setTimeout(()=>{
        content.classList.remove("shake","hardShake");
    },ms);
}

function glitch(ms=400){

    content.classList.add("glitch");

    setTimeout(()=>{
        content.classList.remove("glitch");
    },ms);
}

function flicker(ms=400){

    main.classList.add("flicker");

    setTimeout(()=>{
        main.classList.remove("flicker");
    },ms);
}

function redMode(on){

    document.body.classList.toggle("red",on);
}

function blackout(ms=600){

    main.style.opacity="0";
    sub.style.opacity="0";
    chapter.style.opacity="0";

    setTimeout(()=>{

        main.style.opacity="1";
        sub.style.opacity="1";
        chapter.style.opacity="1";

    },ms);
}

function giant(text,color="#fff",duration=800){

    warning.textContent=text;
    warning.style.color=color;
    warning.style.opacity="1";

    glitch(450);

    setTimeout(()=>{

        warning.style.transition="opacity .2s";
        warning.style.opacity="0";

    },duration);
}

function dot(){

    redDot.style.left=Math.random()*95+"%";
    redDot.style.top=Math.random()*90+"%";

    redDot.style.opacity="1";

    setTimeout(()=>{
        redDot.style.opacity="0";
    },450);
}

function particle(
    char="·",
    big=false,
    falling=false
){

    const el=document.createElement("div");

    el.className="floating"+(big?" big":"");

    el.textContent=char;

    el.style.left=(5+Math.random()*90)+"%";
    el.style.top=(10+Math.random()*80)+"%";

    words.appendChild(el);

    requestAnimationFrame(()=>{

        el.style.animation=
            `${falling?"fall":"floatAway"} ${
                .9+Math.random()*1.5
            }s ease forwards`;

    });

    setTimeout(()=>{
        el.remove();
    },2600);
}

function particleBurst(amount=20){

    const chars=[
        "·",
        "—",
        "/",
        "\\",
        "0",
        "1",
        "?",
        "!",
        "□"
    ];

    for(let i=0;i<amount;i++){

        setTimeout(()=>{

            particle(
                chars[Math.floor(Math.random()*chars.length)],
                Math.random()<.08,
                Math.random()<.15
            );

        },i*15);
    }
}

function ownWord(text){

    if(!text) return;

    const el=document.createElement("div");

    el.className="floating";

    el.textContent=text.toUpperCase();

    el.style.left=(20+Math.random()*60)+"%";
    el.style.top=(30+Math.random()*40)+"%";

    el.style.color="#aaa";

    words.appendChild(el);

    requestAnimationFrame(()=>{

        el.style.animation=
            "floatAway 1.5s ease forwards";

    });

    setTimeout(()=>{
        el.remove();
    },1700);
}

function moveDot(){

    cursorDot.style.left=
        (window.innerWidth/2+(Math.random()*130-65))
        +"px";

    cursorDot.style.top=
        (window.innerHeight/2+150+(Math.random()*30-15))
        +"px";

    cursorDot.style.opacity="1";

    setTimeout(()=>{
        cursorDot.style.opacity="0";
    },160);
}


/* ==========================================================
   UI
========================================================== */

function clearUI(){

    main.textContent="";
    sub.textContent="";
    chapter.textContent="";

    input.style.opacity="0";
    input.style.pointerEvents="none";

    answer.value="";
}

function text(
    title,
    description="",
    label=""
){

    clearUI();

    chapter.textContent=label;
    main.textContent=title;
    sub.textContent=description;

    main.style.opacity="1";
    sub.style.opacity="1";
}

function inputOn(){

    input.style.opacity="1";
    input.style.transform="translateY(0)";
    input.style.pointerEvents="auto";

    answer.focus();
}

function progress(){

    const total=questions.length;

    barFill.style.width=
        (((qIndex+1)/total)*100)+"%";

    count.textContent=
        String(Math.max(0,qIndex+1)).padStart(2,"0")
        +" / "
        +String(total).padStart(2,"0");
}


/* ==========================================================
   PYTANIA — JEDNA ŚCIEŻKA
========================================================== */

const questions=[

    {
        id:"morning",
        q:"Co zrobiłeś dziś rano?",
        hint:"jedno słowo",
        chapter:"POCZĄTEK"
    },

    {
        id:"mood",
        q:"Jak się teraz czujesz?",
        hint:"jedno słowo",
        chapter:"POCZĄTEK"
    },

    {
        id:"person",
        q:"Kto jest dla Ciebie ważny?",
        hint:"jedno słowo",

/* ==========================================================
   PAMIĘĆ
========================================================== */

function clean(v){

    return v
        .trim()
        .replace(/\s+/g," ")
        .slice(0,100);
}

function remember(q,value){

    const v=clean(value);

    memory.answers.push(v);

    if(q.id==="morning")
        memory.morning=v;

    if(q.id==="person")
        memory.person=v;

    if(q.id==="desire")
        memory.desire=v;

    if(q.id==="fear")
        memory.fear=v;

    if(q.id==="loss")
        memory.loss=v;

    if(q.id==="alone")
        memory.alone=v;

    if(q.id==="need")
        memory.need=v;

    if(q.id==="happy")
        memory.happiness=v;

    if(q.id==="change")
        memory.strongWords.push(v);

    if(q.id==="finalChoice")
        memory.strongWords.push(v);

    if(
        q.id==="mood" ||
        q.id==="fear" ||
        q.id==="need"
    ){
        memory.emotionalWords.push(v);
    }
}

function valid(v){

    if(!v) return false;

    const x=v.toLowerCase();

    const allowed=[
        "tak",
        "nie",
        "nie wiem",
        "czasami",
        "czasem",
        "nigdy"
    ];

    if(allowed.includes(x))
        return true;

    if(v.length<2)
        return false;

    if(/^(.)\1{5,}$/i.test(v))
        return false;

    if(/^[0-9]+$/.test(v))
        return false;

    return true;
}

/* ==========================================================
   SUBMIT
========================================================== */

async function submit(){

    if(!running || locked)
        return;

    const value=clean(answer.value);

    if(!valid(value)){

        answer.style.borderBottomColor="#900";

        tone(90,.18,.05,"square");

        await wait(250);

        answer.style.borderBottomColor="#444";

        answer.focus();

        return;
    }

    locked=true;

    const q=questions[qIndex];

    const elapsed=
        performance.now()-memory.lastQuestionStart;

    memory.times.push(elapsed);

    if(
        memory.answers.length>0 &&
        value.toLowerCase()===
        memory.answers[memory.answers.length-1].toLowerCase()
    ){
        memory.changed=true;
    }

    remember(q,value);

    input.style.opacity="0";
    input.style.pointerEvents="none";

    click();

    await wait(200);

    await reaction(q,value);

    /* ------------------------------------------------------
       zaplanowane eskalacje
    ------------------------------------------------------ */

    if(qIndex===1){
        await interruption("one");
    }

    if(qIndex===4){
        await interruption("two");
    }

    if(qIndex===8){
        await interruption("three");
    }

    if(qIndex<questions.length-1){

        qIndex++;

        await wait(350);

        locked=false;

        showQuestion();

    }else{

        await finale();
    }
}

        "nie odpowiadaj.",
        "",
        ""
    );

    await wait(1200);

    /* restart */

    const again=document.createElement("button");

    again.textContent="ZACZNIJ OD NOWA";

    again.style.marginTop="38px";
    again.style.padding="13px 28px";
    again.style.background="#eee";
    again.style.color="#000";
    again.style.border="0";
    again.style.cursor="pointer";
    again.style.letterSpacing="3px";

    content.appendChild(again);

    again.addEventListener(
        "click",
        ()=>{
            location.reload();
        }
    );

    locked=false;
}


/* ==========================================================
   MASTER AUDIO
========================================================== */

function restoreMaster(){

    if(!master)
        return;

    master.gain.cancelScheduledValues(t());

    master.gain.linearRampToValueAtTime(
        .32,
        t()+.7
    );
}


/* ==========================================================
   LOSOWE ŻYCIE EKRANU
========================================================== */

setInterval(()=>{

    if(!running)
        return;

    const r=Math.random();

    if(r<.15)
        particle("·");

    if(r>.86)
        particle(
            ["—","/","\\","?","0","1"][Math.floor(Math.random()*6)]
        );

    if(r>.965)
        dot();

},650);


/* ==========================================================
   MIKRO-ZAKŁÓCENIA
========================================================== */

setInterval(()=>{

    if(!running)
        return;

    const r=Math.random();

    if(r<.035){

        digitalNoise();

        flicker(100);
    }

    if(r>.985){

        const old=main.textContent;

        main.textContent="";

        setTimeout(()=>{
            main.textContent=old;
        },60);
    }

},1400);


/* ==========================================================
   DELIKATNY PARALLAX
========================================================== */

document.addEventListener(
    "mousemove",
    e=>{

        if(!running)
            return;

        if(Math.random()<.035){

            const x=
                (e.clientX/window.innerWidth-.5)*2;

            const y=
                (e.clientY/window.innerHeight-.5)*2;

            app.style.transform=
                `translate(${x*1.5}px,${y*1.5}px)`;

            setTimeout(()=>{
                app.style.transform="";
            },90);
        }
    }
);

</script>
